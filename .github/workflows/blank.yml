name: Build

on:
  push:
    branches: [fifteen]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        target: [a70q]

    env:
      TARGET_DEVICE: ${{ matrix.target }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Free disk space early
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: Cache APT packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt
          key: ${{ runner.os }}-apt-${{ hashFiles('.github/apt-packages.txt') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
          attr ccache clang ffmpeg golang \
          libbrotli-dev libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
          libzstd-dev linux-modules-extra-$(uname -r) lld protobuf-compiler webp
          sudo modprobe erofs f2fs


      - name: Configure Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Import platform signing keys
        env:
          PLATFORM_KEY_PK8: ${{ secrets.PLATFORM_KEY_PK8 }}
          PLATFORM_KEY_PEM: ${{ secrets.PLATFORM_KEY_PEM }}
        run: |
          mkdir -p security
          echo -n "$PLATFORM_KEY_PK8" | base64 --decode > security/unica_platform.pk8
          echo -n "$PLATFORM_KEY_PEM" | base64 --decode > security/unica_platform.x509.pem

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
          cache: gradle

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache ccache objects
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Prepare build environment
        run: |
          source ./buildenv.sh

      - name: Build ROM
        run: |
          source ./buildenv.sh
          run_cmd make_rom

      - name: Upload ROM artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ROM-${{ matrix.target }}
          path: out/
